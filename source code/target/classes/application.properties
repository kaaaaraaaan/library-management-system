# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/lmsdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=src/main/resources/uploads

# JWT
app.jwt.secret=LibraryManagementSystemSuperSecretKeyForJWTSigning2026ChangeMe
app.jwt.expiration-ms=86400000

# Mail (simulated - set real SMTP credentials and app.mail.enabled=true in production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# Logging
logging.level.com.library.lms=INFO
logging.file.name=logs/lms-application.log
